<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Resources and Formulation Co. Limited</title>
    <style>
        /*=====================
GENERAL SETTINGS
======================*/

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f8f6;
    color: #173b32;
}

/*================
NAVIGATION BAR
================*/

.navbar {
    min-height: 105px;
    background: #075333;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 5%;
}

/*===============
logo
===============*/

.logo {
display: flex;
align-items: center;
gap: 12px;
}

.logo-icon {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: white;
    display: flex;
    font-size: 38px;
}

.logo h1 {
    font-size: 32px;
    line-height: 30px;
}

.logo h2 {
    font-size: 20px;
    letter-spacing: 3px;
}

.logo p {
    font-size: 14px;
    font-style: italic;
    margin-top: 4px;
}

/*===============
navigation links
===============*/

nav {
    display: flex;
    align-items: center;
    gap: 40px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 17px;
    padding: 12px 5px;
}

nav a:hover {
    color: #b8e86c;
    border-bottom:4px solid #b4e76b;
}

nav .active {
   border-bottom: 4px solid #b4e76b;
}

/*==============
Register button
==============*/

.register-btn {
    background: #70bd3b;
    padding: 13px 28px !important;
    border-radius: 8px;
}

.register-btn:hover {
    background: #5da72e;
    color: white;
}

/*==================
main container
==================*/

.container {
    width: 92%;
    max-width: 1200px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: 2fr 0.95fr;
    gap: 20px;
}

/*===================
form section
=================*/

.form-section {
    background: white;
    border: 1px solid #d1ded9;
    border-radius: 8px;
    padding: 27px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

/*form heading*/

.form-title {
    display:flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.user-icon {
    width: 58px;
    height: 58px;
    background: #087c4a;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.form-title h2 {
    font-size: 29px;
    color: #075333;
}

.form-title p {
    color: #63776f;
    margin-top: 5px;
}

/*form rows*/

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap:25px
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    color: #233f36;
}

.form-group label span {
    color: red;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd8d3;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #2b9b58;
    box-shadow: 0 0 4px rgba(43,155,88,0.3);
}

textarea {
    height: 100px;
    resize: vertical;
    
}

.radio-group {
    display: flex;
    gap: 35px;
  margin-top: 10px;
}

.radio-option {
    display: flex !important;
    align-items: center;
    gap: 8px;
    font-weight: normal !important;
}

.radio-option input {
    width: 20px;
    height: 20px;
    accent-color: #24994c;
}

.submit-btn {
    width: 100%;
    padding: 13px;
    background: #26994d;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background: #197b3a;
}

footer {
   min-height: 65px;
   background: #075333;
   color: white;
   display: flex;
   align-items: center;
   justify-content: center;
   position: relative;
   margin-top: 30px;
}

/* Responsive layout for tablets and mobile phones */
.hero-image {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    object-fit: cover;
}

.logo {
    min-width: 0;
}

.logo-icon {
    flex: 0 0 65px;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.logo-icon img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.user-icon {
    flex: 0 0 58px;
    overflow: hidden;
}

.user-icon img {
    max-width: 100%;
    height: auto;
}

.container {
    grid-template-columns: minmax(0, 1fr);
    max-width: 900px;
}

.form-section,
.form-row,
.form-group {
    min-width: 0;
}

input,
select,
textarea,
button {
    max-width: 100%;
}

@media (max-width: 900px) {
    .navbar {
        flex-wrap: wrap;
        gap: 18px;
        padding: 18px 4%;
    }

    .logo h1 {
        font-size: clamp(22px, 4vw, 30px);
        line-height: 1.1;
    }

    .logo h2 {
        font-size: clamp(13px, 2.5vw, 18px);
        letter-spacing: 1.5px;
        line-height: 1.4;
    }

    nav {
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 20px;
    }

    nav a {
        font-size: 16px;
    }
}

@media (max-width: 600px) {
    .navbar {
        justify-content: center;
        text-align: center;
    }

    .logo {
        width: 100%;
        justify-content: center;
        gap: 10px;
    }

    .logo-icon {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
    }

    .logo h1 {
        font-size: 20px;
    }

    .logo h2 {
        font-size: 11px;
        letter-spacing: 1px;
    }

    .logo p {
        font-size: 12px;
    }

    nav {
        gap: 8px 12px;
    }

    nav a {
        padding: 8px 4px;
        font-size: 14px;
    }

    nav .register-btn {
        padding: 9px 14px !important;
    }

    .container {
        width: 94%;
        margin: 14px auto;
        gap: 14px;
    }

    .form-section {
        padding: 18px 14px;
    }

    .form-title {
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 20px;
    }

    .user-icon {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
    }

    .form-title h2 {
        font-size: 21px;
        line-height: 1.25;
    }

    .form-title p {
        font-size: 14px;
        line-height: 1.45;
    }

    .form-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
    }

    .radio-group {
        flex-wrap: wrap;
        gap: 16px;
    }

    input,
    select,
    textarea {
        font-size: 16px;
    }

    footer {
        padding: 16px 12px;
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
    }
}
    </style>
</head>
<body>
    <!--navigation bar-->
    <header class="navbar">
        <div class="logo">
            <div class="logo-icon"><img src="logo1.png" alt="image is here"></div>

            <div>
                <h1>AGRO RESOURCES</h1>
                <h2>AND FORMULATION CO. LIMITED</h2>
                <P>quality feed for healthy poultry</P>
            </div>
        </div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="agro-resources-about-us.html">About us</a>
            <a href="product.html">Products</a>
            <a href="agro-resources-contact.html">Contact</a>
            <a href="#register" class="register-btn">Register</a>
        </nav>
    </header>
    <div>
        <img src="hero section.png" alt="Agro Resources and Formulation Co. Limited poultry feed" class="hero-image">
    </div>
    
    <!--main content-->
    <main class="container">

        <!--registration form-->
        <section class="form-section" id="register">

            <div class="form-title">
                <div class="user-icon"><img src="icons8-profile-50.png" alt=""></div>
                <div>
                    <h2>Customer Registration Form</h2>
                    <p>details below to register with us and place your order.</p>
                </div>
            </div>
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullname">FULL NAME <span>*</span></label>
                        <input type="text" id="fullname" placeholder="enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span>*</span></label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number <span>*</span></label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password <span>*</span></label>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="Enter your location" required>
                </div>

                <div class="form-group">
                    <label for="feed">select feed type <span>*</span></label>
                    <select id="feed" required>
                        <option value="">--select feed type--</option>
                        <option value="starter">chick starter feed</option>
                        <option value="grower">Grower feed</option>
                        <option value="finisher">Finisher feed</option>
                        <option value="layer">layer feed</option>
                    </select>
                </div>

                <!--customer type-->
                <div class="form-group">
                    <label>customer type <span>*</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="customer" value="distributor">
                            <span>distributor</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="customer" value="retailer">
                            <span>Retailer</span>
                        </label>
                    </div>
                </div>
                <!--quantity-->
                <div class="form-group">
                    <label for="quantity">Quantity Required <span>*</span></label>
                    <input type="number" id="quantity" placeholder="Enter quantity (e.g 50)" min="1" required>

                </div>

                <!--message-->
                <div class="form-group">
                    <label for="message">additional information</label>
                    <textarea id="message" placeholder="Enter your message or special request..."></textarea>
                </div>
                <button type="submit" class="submit-btn">&nbsp; submit Registration</button>
            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Agro Resources and Formulation co. Limited.
            All rights reserved.
        </p>
    </footer>
</body>
</html>
